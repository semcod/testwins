schema: testwins.config/v1
project: clonerd-ux
base_url: http://127.0.0.1:8891
matrix: chromium
headless: true
sandbox: false
locale: pl-PL
timezone: Europe/Warsaw
color_scheme: dark
allowed_origins: []
capture:
  repeats: 2
  scroll_tiles: 4
  timeout_ms: 20000
  settle_ms: 250
  max_cell_seconds: 900
  ready_selector: '#main'
  mask_selectors:
  - input
  - textarea
  - '[contenteditable=true]'
  - '[data-private]'
  before_steps: true
axe:
  enabled: false
  required: false
baseline:
  fail_on_difference: false
devices:
  desktop:
    width: 1440
    height: 900
    dpr: 1
    touch: false
    mobile: false
routes:
- id: services
  path: /?source=demo&mode=user&layout=desktop&view=services&tour=off
journeys: []
performance:
  enabled: true
  required: true
  budgets:
    JSHeapUsedSize: 104857600
