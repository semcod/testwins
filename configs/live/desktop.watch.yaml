schema: testwins.watch/v1
project: local-gui
output: .testwins/desktop
resources:
  max_workers: 1
  max_tier: 2
  max_hot_pages: 0
  cpu_limit: 70
  reserve_mb: 512
screens:
  - id: controlled-app
    # Explicit authorization: only this rectangle, never the whole desktop automatically.
    allow_desktop_capture: true
    region: {left: 0, top: 0, width: 1280, height: 720}
    interval_s: 2
    mask_rects:
      - {x: 0, y: 0, width: 1280, height: 40}
    templates: []
llm:
  enabled: false
  env_file: .env
  calls_per_hour: 2
  cooldown_s: 900
cv:
  enabled: true
  backend: opencv
